[project]
name = "soma"
version = "0.1.0"
description = "SOMA — Self-Organizing Model Architecture for surgical robotics"
requires-python = ">=3.11,<3.12"
dependencies = [
    # API layer
    "fastapi==0.109.*",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
    # World model / ML
    "numpy<2",
    "torch>=2.2",
    # Orchestration + agents
    "langgraph>=0.2",
    "langgraph-checkpoint>=1.0",
    "anthropic>=0.40",
    # Simulation (pybullet installed separately — see Findings; SurRoL editable)
    "pillow>=10.0",
    # Data + observability
    "polars>=1.0",
    "python-dotenv>=1.0",
    "wandb>=0.16",
    # Testing
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.26,<0.28",
    "huggingface-hub>=1.28.0",
    "datasets>=5.0.1",
    "lerobot>=0.1.0",
    "rerun-sdk==0.36.3",
    "craftax==1.4.5",
    "jax[cpu]<0.6",
    "hydra-core>=1.3.5",
    "omegaconf>=2.3.1",
    "einops>=0.7.0",
    "loguru>=0.7.3",
    "rich>=15.0.0",
    "yet-another-retnet>=0.5.1",
    "scikit-learn>=1.9.0",
]

[tool.uv]
package = false
override-dependencies = [
    "numpy==1.26.4",
    "rerun-sdk==0.36.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
